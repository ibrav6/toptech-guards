# حارسٌ لا يُشغَّل يساوي غيابه — فالفحص على كل دفعٍ وPR.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python3 plugins/toptech-guards/test_guards.py
      - name: JSON صالح
        run: |
          python3 - <<'EOF'
          import json
          for f in ("plugins/toptech-guards/hooks/hooks.json",
                    "plugins/toptech-guards/.claude-plugin/plugin.json",
                    ".claude-plugin/marketplace.json"):
              json.load(open(f, encoding="utf-8"))
          print("json ok")
          EOF
      # ‼ يُشغَّل مباشرةً كما يشغّله كلود، لا عبر `python3` — قِيس 2026-09-04:
      #   الملف بلا بت تنفيذ سقط عند بدء الجلسة بـEACCES وهذه الخطوة خضراء.
      - name: سطر الحالة يعمل على مستودعٍ حقيقي
        run: |
          echo '{"cwd":"'"$PWD"'","source":"startup"}' \
            | plugins/toptech-guards/scripts/session_start.py \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); ctx=d["hookSpecificOutput"]["additionalContext"]; assert "دستور قسم التطوير" in ctx, ctx[-300:]; print("session_start ok")'
      - name: لا مسار إنتاجٍ ولا عنوان داخلي في مستودعٍ عامّ
        run: |
          ! grep -rnE '192\.168\.|/volume1/' plugins/ .claude-plugin/ design-system/src design-system/gallery design-system/*.md README.md

  # نظام الهوية `@toptech/ui` — مصدرُ كل منتجات المجموعة، فبوابتُه هنا لا عند
  # المستهلك: منتجٌ يفحص مكتبةً ثانيةً يجعل الترقية رهينةَ فحصه هو.
  design-system:
    runs-on: ubuntu-24.04
    # ‼ الصورة نفسها التي تولّد الصور المرجعية — فرقُ الخطوط بين macOS
    #   وLinux يُحمِّر المقارنة البصرية بلا عطبٍ في المكوّن.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    defaults:
      run:
        working-directory: design-system
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: design-system/package-lock.json
      - run: npm ci
      - run: npm run check:design
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: design-system-evidence
          path: |
            design-system/playwright-report/
            design-system/test-results/
            design-system/.lighthouseci/reports/
          retention-days: 14
