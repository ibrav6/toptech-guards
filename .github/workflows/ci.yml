# حارسٌ لا يُشغَّل يساوي غيابه — فالفحص على كل دفعٍ وPR.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python3 plugins/toptech-guards/test_guards.py
      - name: JSON صالح
        run: |
          python3 - <<'EOF'
          import json
          for f in ("plugins/toptech-guards/hooks/hooks.json",
                    "plugins/toptech-guards/.claude-plugin/plugin.json",
                    ".claude-plugin/marketplace.json"):
              json.load(open(f, encoding="utf-8"))
          print("json ok")
          EOF
      - name: سطر الحالة يعمل على مستودعٍ حقيقي
        run: |
          echo '{"cwd":"'"$PWD"'","source":"startup"}' \
            | python3 plugins/toptech-guards/scripts/session_start.py \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); ctx=d["hookSpecificOutput"]["additionalContext"]; assert "دستور قسم التطوير" in ctx, ctx[-300:]; print("session_start ok")'
      - name: لا مسار إنتاجٍ ولا عنوان داخلي في مستودعٍ عامّ
        run: |
          ! grep -rnE '192\.168\.|/volume1/' plugins/ .claude-plugin/ README.md
